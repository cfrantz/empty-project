[package]
name = "imgui_rs_deps"
version = "0.0.0"
edition = "2018"

[lib]
path = "empty_file.rs"

[dependencies]
# imgui & imgui-sys
bitflags = "1"
mint = "0.5.6"
parking_lot = "0.12"
cfg-if = "1"
chlorine = "1.0.7"

# imgui-glow-support
glow = "0.13.1"
image = "0.23"
memoffset = "0.9"

# imgui-sdl2-support
sdl2 = "0.34.5"

# imgui-winit-support
winit = { version = "0.29.3", default-features = false }
